# CI del plugin QGIS TIDashboard.
#
# Tre job separati di proposito:
#   python-puro  - 10 secondi, niente QGIS, niente rete
#   pacchetto    - zip in dist/ + SHA256 + metadata
#   qgis         - Docker ufficiale QGIS 4.2, test di simbologia e planimetria
#
# Un tag vX.Y.Z pubblica GitHub Release con lo zip della CI, non uno
# costruito a mano. version= in metadata.txt deve coincidere col tag.
#
# PERCHE' IL PACCHETTO SI COSTRUISCE QUI E NON A MANO: chi scarica da GitHub
# con "Code -> Download ZIP" ottiene TIDashboard-main.zip, che ha una cartella
# in piu' in cima. QGIS ci trova il metadata.txt un livello troppo in basso,
# registra il plugin come "TIDashboard-main/tidashboard" - un nome con una
# barra dentro, che come modulo Python non esiste - e il caricamento fallisce
# con ModuleNotFoundError. Non e' un caso limite: e' successo davvero.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python-puro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test senza QGIS
        run: |
          set -e
          python tidashboard/test_modello.py
          python tidashboard/test_dati_comune.py
          python tidashboard/test_cerca_fondo.py
          python tidashboard/test_scarica_mu.py
          python tidashboard/test_java_env.py
          python tidashboard/test_coordinate.py
          python tidashboard/test_archivio.py
          python tidashboard/test_relazioni.py
          python tidashboard/test_errori_import.py

      - name: ruff sui moduli puliti
        run: |
          pip install ruff
          # I moduli PULITI, non tutti. Sul resto c'e' un arretrato di 157
          # rilievi, quasi tutti in tidashboard.py: si smaltisce quando quei
          # pezzi escono dalla classe, non mescolandolo a un rifacimento.
          # Ogni modulo che esce entra in questa lista e ci resta.
          ruff check crea_zip_plugin.py tidashboard/java_env.py tidashboard/test_java_env.py \
                     tidashboard/pubblica_progetto.py tidashboard/test_pubblica_progetto.py \
                     tidashboard/archivio.py tidashboard/test_archivio.py \
                     tidashboard/verifica_dxf.py tidashboard/test_verifica_dxf.py \
                     tidashboard/applica_etichette.py \
                     tidashboard/relazioni.py tidashboard/test_relazioni.py \
                     tidashboard/errori_import.py tidashboard/test_errori_import.py

      - name: metadata
        run: python crea_zip_plugin.py --solo-check-metadata

  pacchetto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Costruisci e verifica lo zip
        run: python crea_zip_plugin.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/
          if-no-files-found: error

  qgis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LE ULTIME RIGHE DIVENTANO ANNOTAZIONI, non solo registro. Il registro
      # di una Actions si legge solo da autenticati ("Sign in to view logs"),
      # e con un job rosso davanti restava da indovinare quale prova fosse
      # caduta - che e' il modo per accumulare tentativi invece di correzioni.
      # Le annotazioni si leggono anche senza accedere.
      - name: Test con QGIS 4.2 headless
        run: |
          set +e
          # TIDASHBOARD_QGIS_ATTESO: test_relazioni ha un gruppo di prove che
          # salta da se' quando QGIS non c'e' (cosi' gira anche nel lavoro
          # puro). QUI QGIS c'e', e uno skip silenzioso sarebbe una suite
          # verde che non ha provato niente: con questa variabile, se
          # l'import di qgis fallisce la prova esce rossa invece di saltare.
          docker run --rm \
            --entrypoint bash \
            -v "$PWD":/src \
            -w /src \
            -e QT_QPA_PLATFORM=offscreen \
            -e TIDASHBOARD_QGIS_ATTESO=1 \
            qgis/qgis:4.2-trixie \
            -lc 'rc=0; for t in test_style_logic test_planimetria test_verifica_dxf test_pubblica_progetto test_inventario test_relazioni test_errori_import; do echo "== $t =="; python3 -X faulthandler tidashboard/$t.py || { echo "USCITA $? nella suite $t"; rc=1; }; done; exit $rc' 2>&1 | tee /tmp/qgis.log
          esito=${PIPESTATUS[0]}
          if [ "$esito" -ne 0 ]; then
            echo "::error::test QGIS falliti (uscita $esito)"
            # ESTRATTO MIRATO, non "le ultime N righe": GitHub conserva al
            # massimo dieci annotazioni per passo, e con l'uscita verbosa di
            # unittest quelle dieci erano tutte prove RIUSCITE - il guasto
            # restava fuori. Qui si prendono i nomi delle prove cadute,
            # l'eccezione, il conto finale e - per i CROLLI, che non producono
            # nessuna delle tre - la suite che e' morta e il punto in cui.
            # Uscita 139 e' un segmentation fault: unittest non ne sa niente,
            # e senza faulthandler l'unica traccia era il numero.
            {
              grep -E '^USCITA ' /tmp/qgis.log
              grep -E '^(Fatal Python error|Current thread|  File ")' /tmp/qgis.log | tail -n 4
              grep -E '^(FAIL|ERROR):' /tmp/qgis.log
              grep -E '^[A-Za-z_.]+(Error|Exception):' /tmp/qgis.log | tail -n 2
              grep -E '^(Ran |FAILED)' /tmp/qgis.log | tail -n 2
            } | head -n 9 | while IFS= read -r riga; do
              echo "::error::$riga"
            done
          fi
          exit "$esito"
        # test_dialog_ui.py alza una GUI vera: va con xvfb in un secondo
        # tempo, non in questo job. Un rosso per un QMessageBox non deve
        # mascherare un regressione sui simboli a 600 dpi.

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-puro, pacchetto, qgis]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: dist

      - name: Il tag deve coincidere con metadata.txt
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          META=$(sed -n 's/^version=//p' tidashboard/metadata.txt | tr -d '[:space:]')
          echo "tag=$TAG metadata=$META"
          test "$TAG" = "$META"

      # UN NOME CHE NON CAMBIA MAI, accanto a quello con la versione. Serve a
      # un solo scopo: dare al README un indirizzo che resti valido dopo ogni
      # pubblicazione -
      #   .../releases/latest/download/tidashboard.zip
      # Il file con la versione nel nome resta, ed e' quello che il catalogo
      # plugins.xml indirizza (li' l'indirizzo DEVE essere quello del tag: un
      # "latest" servirebbe un pacchetto diverso da quello dichiarato).
      - name: Copia con nome stabile per il collegamento "ultima versione"
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cp "dist/tidashboard_${TAG}.zip" dist/tidashboard.zip
          (cd dist && sha256sum tidashboard.zip > tidashboard.zip.sha256)
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
